name: Release

# A `v*` tag is the single release trigger: it typechecks, tests, builds,
# publishes the tarball to npm with provenance, and opens the GitHub Release
# with that tarball attached. Manual runs (workflow_dispatch) only verify the
# build — they never publish, so a bad branch state cannot reach the registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # gh release create + asset upload
  id-token: write # npm provenance (Sigstore)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Tag matches package.json
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag package=$pkg"
          test "$pkg" = "$tag"

      # The plugin market renders the GitHub Release body verbatim; a
      # --generate-notes body on a repo that pushes straight to main is one
      # compare link. Refuse to publish a version whose hand-written body is
      # missing or thin, so an empty changelog can never reach the market.
      - name: Verify release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing — every tag needs a committed release body (see AGENTS.md)"
            exit 1
          fi
          bytes="$(wc -c < "$notes" | tr -d ' ')"
          lines="$(grep -c . "$notes" || true)"
          sections="$(grep -c '^## ' "$notes" || true)"
          echo "$notes: ${bytes} bytes, ${lines} non-empty lines, ${sections} sections"
          if [ "$bytes" -lt 300 ] || [ "$lines" -lt 8 ] || [ "$sections" -lt 1 ]; then
            echo "::error::$notes is too thin — need >=300 bytes, >=8 non-empty lines and >=1 '## ' section"
            exit 1
          fi
          if ! grep -q 'Full Changelog' "$notes"; then
            echo "::error::$notes has no '**Full Changelog**' line"
            exit 1
          fi

      - name: Publish to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for f in dist/*.tgz; do
            npm publish "./$f" --provenance --access public
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
            # A re-run must not leave stale generated notes behind.
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              dist/*.tgz
          fi
