name: Release

# A `v*` tag is the single release trigger: it typechecks, tests, builds,
# publishes the tarball to npm with provenance, and opens the GitHub Release
# with that tarball attached. Manual runs (workflow_dispatch) only verify the
# build — they never publish, so a bad branch state cannot reach the registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # gh release create + asset upload
  id-token: write # npm provenance (Sigstore)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag package=$pkg"
          test "$pkg" = "$tag"

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for f in dist/*.tgz; do
            npm publish "./$f" --provenance --access public
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tgz \
          || gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
